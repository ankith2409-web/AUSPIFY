<text x="24" y="85" font-size="10" font-weight="700" fill="#65727a">WIREFRAME / SAMPLE STATES ONLY</text>
<text x="24" y="128" font-size="24" font-weight="700" fill="#27323a">Tell us what happened</text>
<text x="24" y="170" font-size="13" font-weight="700" fill="#27323a">Patient location</text><rect x="24" y="182" width="342" height="50" fill="#fff" stroke="#b8c3c8" rx="6"/><text x="38" y="213" font-size="14" font-weight="400" fill="#27323a">Near KR Puram, Bengaluru</text><text x="24" y="275" font-size="13" font-weight="700" fill="#27323a">What kind of help?</text><rect x="24" y="291" width="342" height="44" fill="#fff" stroke="#b8c3c8" rx="6"/><text x="40" y="318" font-size="13" font-weight="400" fill="#27323a">● Medical emergency</text><rect x="24" y="344" width="342" height="44" fill="#fff" stroke="#b8c3c8" rx="6"/><text x="40" y="371" font-size="13" font-weight="400" fill="#27323a">○ Accident / injury</text><rect x="24" y="397" width="342" height="44" fill="#fff" stroke="#b8c3c8" rx="6"/><text x="40" y="424" font-size="13" font-weight="400" fill="#27323a">○ Other / unsure</text><text x="24" y="485" font-size="13" font-weight="700" fill="#27323a">Contact number · sample</text><rect x="24" y="497" width="342" height="50" fill="#fff" stroke="#b8c3c8" rx="6"/><text x="38" y="528" font-size="14" font-weight="400" fill="#27323a">0000000000</text><text x="24" y="569" font-size="12" font-weight="400" fill="#65727a">Use 10 fictional digits, such as 0000000000.</text><text x="24" y="584" font-size="13" font-weight="700" fill="#27323a">Optional note</text><rect x="24" y="596" width="342" height="50" fill="#fff" stroke="#b8c3c8" rx="6"/><text x="38" y="627" font-size="14" font-weight="400" fill="#27323a">Sample landmark: east gate</text><rect x="24" y="686" width="342" height="52" fill="#35434b" stroke="#a8b5ba" rx="6"/><text x="39" y="718" font-size="14" font-weight="700" fill="#fff">Review request</text><rect x="24" y="750" width="342" height="52" fill="#fff" stroke="#a8b5ba" rx="6"/><text x="39" y="782" font-size="14" font-weight="700" fill="#27323a">Back to home</text>
</g></g>
