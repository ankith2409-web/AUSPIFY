<svg xmlns="http://www.w3.org/2000/svg" width="1362" height="2100" viewBox="0 0 1362 2100" role="img" aria-labelledby="title desc"><title id="title">Task 1 — six editable low fidelity wireframes</title><desc id="desc">Home, details, review, awaiting acceptance, sample assignment and failed delivery. Grayscale layout study. No real request or call is made.</desc><rect width="1362" height="2100" fill="#f1f3f3"/><g font-family="Arial, sans-serif">
<text x="48" y="55" font-size="15" font-weight="700" fill="#27323a">THE SAVIOUR / TASK 01</text>
<text x="48" y="100" font-size="32" font-weight="700" fill="#27323a">Mobile wireframes · layout and user flow</text>
<text x="48" y="136" font-size="16" font-weight="400" fill="#27323a">Home → Details → Review → Finding help → Assigned. Failure: Review → Not sent → Retry.</text>
<text x="48" y="164" font-size="13" font-weight="400" fill="#65727a">Editable vector source · 390 × 844 px per screen · All content and states are illustrative.</text>
<g id="screen-01" transform="translate(48,205)">
