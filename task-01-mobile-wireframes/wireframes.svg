<text x="24" y="85" font-size="10" font-weight="700" fill="#65727a">WIREFRAME / SAMPLE STATES ONLY</text>
<text x="24" y="128" font-size="24" font-weight="700" fill="#27323a">Finding available help</text>
<rect x="24" y="170" width="342" height="160" fill="#eff1f1" stroke="#b8c3c8" rx="6"/><text x="40" y="250.0" font-size="13" font-weight="700" fill="#65727a">WAITING FOR ACCEPTANCE</text><text x="24" y="384" font-size="17" font-weight="700" fill="#27323a">Proposed next steps</text><text x="24" y="425" font-size="14" font-weight="400" fill="#27323a">1. Service confirms delivery. 2. A</text><text x="24" y="446" font-size="14" font-weight="400" fill="#27323a">hospital accepts the request. 3.</text><text x="24" y="467" font-size="14" font-weight="400" fill="#27323a">Verified vehicle details appear.</text><rect x="24" y="620" width="342" height="52" fill="#fff" stroke="#a8b5ba" rx="6"/><text x="39" y="652" font-size="14" font-weight="700" fill="#27323a">Show sample acceptance</text><rect x="24" y="694" width="342" height="52" fill="#fff" stroke="#a8b5ba" rx="6"/><text x="39" y="726" font-size="14" font-weight="700" fill="#27323a">Call emergency services</text><text x="24" y="780" font-size="12" font-weight="400" fill="#27323a">Sample only. No hospital contacted.</text>
