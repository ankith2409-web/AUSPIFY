<rect x="0" y="20" width="390" height="844" fill="#fff" stroke="#34424b" rx="18"/>
<g transform="translate(0,20)">
<text x="24" y="56" font-size="12" font-weight="700" fill="#65727a">THE SAVIOUR</text>
<text x="24" y="85" font-size="10" font-weight="700" fill="#65727a">WIREFRAME / SAMPLE STATES ONLY</text>
<text x="24" y="128" font-size="24" font-weight="700" fill="#27323a">Get help quickly</text>
<rect x="24" y="160" width="342" height="210" fill="#eff1f1" stroke="#b8c3c8" rx="6"/><text x="40" y="265.0" font-size="13" font-weight="700" fill="#65727a">MAP / SAMPLE LOCATION</text><text x="24" y="410" font-size="13" font-weight="700" fill="#27323a">Sample pickup</text><rect x="24" y="422" width="342" height="50" fill="#fff" stroke="#b8c3c8" rx="6"/><text x="38" y="453" font-size="14" font-weight="400" fill="#27323a">Near KR Puram, Bengaluru</text><text x="24" y="505" font-size="14" font-weight="400" fill="#27323a">This pickup is prefilled for the demo.</text><text x="24" y="526" font-size="14" font-weight="400" fill="#27323a">Edit it on the next screen.</text><rect x="24" y="660" width="342" height="52" fill="#35434b" stroke="#a8b5ba" rx="6"/><text x="39" y="692" font-size="14" font-weight="700" fill="#fff">Request ambulance</text><rect x="24" y="724" width="342" height="52" fill="#fff" stroke="#a8b5ba" rx="6"/><text x="39" y="756" font-size="14" font-weight="700" fill="#27323a">Call emergency services</text>
</g></g>
<g id="screen-02" transform="translate(486,205)">
<text x="0" y="0" font-size="17" font-weight="700" fill="#27323a">02 / Request details</text>
<rect x="0" y="20" width="390" height="844" fill="#fff" stroke="#34424b" rx="18"/>
<g transform="translate(0,20)">
