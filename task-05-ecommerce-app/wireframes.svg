"/><text x="18" y="60" class="label">FORM &amp; FIELD · prototype</text><text x="18" y="106" font-size="20" font-weight="700">Checkout</text><text x="18" y="131" font-size="11" font-weight="700">Email address</text><rect x="18" y="139" width="354" height="32" rx="3" fill="white" stroke="#aaa"/><text x="28" y="160" font-size="11" font-weight="400">demo@example.com</text><text x="18" y="194" font-size="11" font-weight="700">First name</text><rect x="18" y="202" width="168" height="32" rx="3" fill="white" stroke="#aaa"/><text x="28" y="223" font-size="11" font-weight="400">Demo</text><text x="204" y="194" font-size="11" font-weight="700">Last name</text><rect x="204" y="202" width="168" height="32" rx="3" fill="white" stroke="#aaa"/><text x="214" y="223" font-size="11" font-weight="400">Reviewer</text><text x="18" y="257" font-size="11" font-weight="700">Street address</text><rect x="18" y="265" width="354" height="32" rx="3" fill="white" stroke="#aaa"/><text x="28" y="286" font-size="11" font-weight="400">42 Sample Road</text><text x="18" y="325" font-size="10" font-weight="400">Sample details only · no payment is collected</text><rect class="cta" x="18" y="340" width="354" height="40" rx="3"/><text x="30" y="365" class="ctaText">Review sample confirmation</text><text x="0" y="427" class="label">Bag → checkout preserves the draft in page memory.</text></g><g transform="translate(465 593)"><text y="18" class="heading">05 / Recover from errors</text><rect y="34" width="390" height="366" rx="8" fill="white" stroke="#777"/><path d="M0 75h390" stroke="#ccc"/><text x="18" y="60" class="label">FORM &amp; FIELD · prototype</text><text x="18" y="106" font-size="20" font-weight="700">Check your details</text><text x="18" y="140" font-size="11" font-weight="700">Email address</text><rect x="18" y="148" width="354" height="32" rx="3" fill="white" stroke="#aaa"/><text x="28" y="169" font-size="11" font-weight="400">demo@example.com</text><text x="18" y="206" font-size="11" font-we