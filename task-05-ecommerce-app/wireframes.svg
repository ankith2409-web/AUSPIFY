<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 1120" role="img" aria-labelledby="title desc"><title id="title">Form &amp; Field / shopping journey</title><desc id="desc">Find an object → understand it → edit the bag → enter sample details → confirm the simulation.</desc><style>text{font-family:Arial,sans-serif;fill:#262626}.label{font-size:12px}.heading{font-size:19px;font-weight:700}.box{fill:#f3f3f3;stroke:#aaa}.cta{fill:#333}.ctaText{fill:white;font-size:12px}</style><rect width="1320" height="1120" fill="#fafafa"/><text x="40" y="48" font-size="28" font-weight="700">Form &amp; Field / shopping journey</text><text x="40" y="77" font-size="14">Find an object → understand it → edit the bag → enter sample details → confirm the simulation.</text><g transform="translate(40 113)"><text y="18" class="heading">01 / Discover</text><rect y="34" width="390" height="366" rx="8" fill="white" stroke="#777"/><path d="M0 75h390" stroke="#ccc"/><text x="18" y="60" class="label">FORM &amp; FIELD · prototype</text><text x="18" y="104" font-size="20" font-weight="700">Objects for the everyday</text><rect x="18" y="120" width="83" height="27" rx="3" fill="white" stroke="#aaa"/><text x="27" y="138" font-size="10" font-weight="400">All objects</text><rect x="108" y="120" width="83" height="27" rx="3" fill="white" stroke="#aaa"/><text x="117" y="138" font-size="10" font-weight="400">Lighting</text><rect x="198" y="120" width="83" height="27" rx="3" fill="white" stroke="#aaa"/><text x="207" y="138" font-size="10" font-weight="400">Decor</text><rect x="18" y="162" width="107" height="95" rx="3" fill="#f0f0f0" stroke="#aaa"/><path d="M18 162l107 95M125 162l-107 95" stroke="#ccc"/><text x="18" y="275" font-size="12" font-weight="700">Lamp</text><text x="18" y="295" font-size="11" font-weight="400">$248</text><rect x="18" y="306" width="107" height="27" rx="3" fill="white" stroke="#aaa"/><text x="27" y="324" font-size="10" font-weight="400">Add to bag</text><rect x="137" y="162" width="107" height="95" rx="3" fill="#f0f0f0" stroke="#aaa"/><path d="M137 162l107 95M244 162l-107 95" stroke="#ccc"/><text x="137" y="275" font-size="12" font-weight="700">Table</text><text x="137" y="295" font-size="11" font-weight="400">$398</text><rect x="137" y="306" width="107" height="27" rx="3" fill="white" stroke="#aaa"/><text x="146" y="324" font-size="10" font-weight="400">Add to bag</text><rect x="256" y="162" width="107" height="95" rx="3" fill="#f0f0f0" stroke="#aaa"/><path d="M256 162l107 95M363 162l-107 95" stroke="#ccc"/><text x="256" y="275" font-size="12" font-weight="700">Cushion</text><text x="256" y="295" font-size="11" font-weight="400">$78</text><rect x="256" y="306" width="107" height="27" rx="3" fill="white" stroke="#aaa"/><text x="265" y="324" font-size="10" font-weight="400">Add to bag</text><rect class="cta" x="18" y="340" width="354" height="40" rx="3"/><text x="30" y="365" class="ctaText">View details / Add to bag</text><text x="0" y="427" class="label">Image, title, and details link open the same product.</text></g><g transform="translate(465 113)"><text y="18" class="heading">02 / Understand the object</text><rect y="34" width="390" height="366" rx="8" fill="white" stroke="#777"/><path d="M0 75h390" stroke="#ccc"/><text x="18" y="60" class="label">FORM &amp; FIELD · prototype</text><rect x="18" y="94" width="160" height="206" rx="3" fill="#f0f0f0" stroke="#aaa"/><path d="M18 94l160 206M178 94l-160 206" stroke="#ccc"/><text x="196" y="110" font-size="17" font-weight="700">Ceramic lamp</text><text x="196" y="138" font-size="15" font-weight="400">$248.00</text><path d="M196 161h155" stroke="#aaa"/><path d="M196 174h155" stroke="#aaa"/><path d="M196 187h155" stroke="#aaa"/><path d="M196 215h155" stroke="#aaa"/><path d="M196 229h155" stroke="#aaa"/><text x="196" y="259" font-size="11" font-weight="400">Stoneware / linen</text><text x="196" y="281" font-size="11" font-weight="400">32 × 42 cm</text><text x="18" y="325" font-size="11" font-we