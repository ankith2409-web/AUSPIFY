<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 1120" role="img" aria-labelledby="title desc"><title id="title">The Saviour / handoff structure</title><desc id="desc">Two connected explorations: the three-role local model and the patient delivery-state study.</desc><style>text{font-family:Arial,sans-serif;fill:#262626}.label{font-size:12px}.heading{font-size:19px;font-weight:700}.box{fill:#f3f3f3;stroke:#aaa}.cta{fill:#333}.ctaText{fill:white;font-size:12px}</style><rect width="1320" height="1120" fill="#fafafa"/><text x="40" y="48" font-size="28" font-weight="700">The Saviour / handoff structure</text><text x="40" y="77" font-size="14">Two connected explorations: the three-role local model and the patient delivery-state study.</text><g transform="translate(40 113)"><text y="18" class="heading">01 / Patient request</text><rect y="34" width="390" height="366" rx="8" fill="white" stroke="#777"/><path d="M0 75h390" stroke="#ccc"/><text x="18" y="60" class="label">THE SAVIOUR · prototype</text><text x="18" y="106" font-size="20" font-weight="700">Get help now</text><text x="18" y="133" font-size="11" font-weight="700">Pickup location</text><rect x="18" y="141" width="354" height="32" rx="3" fill="white" stroke="#aaa"/><text x="28" y="162" font-size="11" font-weight="400">Sample Gate 2</text><rect x="18" y="193" width="354" height="29" rx="3" fill="white" stroke="#aaa"/><circle cx="32" cy="207" r="5" fill="#555" stroke="#777"/><text x="48" y="212" font-size="11" font-weight="400">Medical emergency</text><rect x="18" y="228" width="354" height="29" rx="3" fill="white" stroke="#aaa"/><circle cx="32" cy="242" r="5" fill="white" stroke="#777"/><text x="48" y="247" font-size="11" font-weight="400">Road accident</text><rect x="18" y="263" width="354" height="29" rx="3" fill="white" stroke="#aaa"/><circle cx="32" cy="277" r="5" fill="white" stroke="#777"/><text x="48" y="282" font-size="11" font-weight="400">Other / unsure</text><text x="18" y="324" font-size="11" font-weight="400">Optional context · direct call alternative</text><rect class="cta" x="18" y="340" width="354" height="40" rx="3"/><text x="30" y="365" class="ctaText">Create demo request</text><text x="0" y="427" class="label">Edits survive changing workspaces before submission.</text></g><g transform="translate(465 113)"><text y="18" class="heading">02 / Hospital handoff</text><rect y="34" width="390" height="366" rx="8" fill="white" stroke="#777"/><path d="M0 75h390" stroke="#ccc"/><text x="18" y="60" class="label">THE SAVIOUR · prototype</text><text x="18" y="106" font-size="20" font-weight="700">Incoming request</text><text x="18" y="133" font-size="10" font-weight="400">REQUEST SV-DEMO</text><text x="18" y="153" font-size="12" font-weight="700">Medical emergency · Sample Gate 2</text><path d="M18 163h320" stroke="#aaa"/><rect x="18" y="176" width="170" height="27" rx="3" fill="white" stroke="#aaa"/><text x="27" y="194" font-size="10" font-weight="400">Accept request</text><text x="18" y="232" font-size="11" font-weight="700">Sample vehicle identifier</text><rect x="18" y="240" width="354" height="32" rx="3" fill="white" stroke="#aaa"/><text x="28" y="261" font-size="11" font-weight="400">DEMO-42</text><text x="18" y="306" font-size="11" font-weight="400">Dispatch is available after acceptance.</text><rect class="cta" x="18" y="340" width="354" height="40" rx="3"/><text x="30" y="365" class="ctaText">Accept → mark en route</text><text x="0" y="427" class="label">Local state gates actions; no institution is connected.</text></g><g transform="translate(890 113)"><text y="18" class="heading">03 / Traffic and completion</text><rect y="34" width="390" height="366" rx="8" fill="white" stroke="#777"/><path d="M0 75h390" stroke="#ccc"/><text x="18" y="60" class="label">THE SAVIOUR · prototype</text><text x="18" y="106" font-size="20" font-weight="700">Route alert</text><text x="18" y="139" font-size="10" font-weight="400">PICKUP</text><text x="18" y="159" font-size="12" font-weight="700">Sample Gate 2</text><path d="M18 169h320" stroke="#aaa"/><text x="18" y="202" font-size="10" font-weight="400">DESTINATION</text><text x="18" y="222" font-size="12" font-weight="700">City Care Hospital (demo)</text><path d="M18 232h320" stroke="#aaa"/><rect x="18" y="247" width="210" height="27" rx="3" fill="white" stroke="#aaa"/><text x="27" y="265" font-size="10" font-weight="400">Acknowledge route alert</text><text x="18" y="302" font-size="11" font-weight="400">Arrival retains details and recorded events.</text><rect class="cta" x="18" y="340" width="354" height="40" rx="3"/><text x="30" y="365" class="ctaText">Acknowledge / Start new demo</text><text x="0" y="427" class="label">Arrival does not imply a traffic acknowledgement.</text></g><g transform="translate(40 593)"><text y="18" class="heading">04 / Review before send</text><rect y="34" width="390" height="366" rx="8" fill="white" stroke="#777"/><path d="M0 75h390" stroke="#ccc"/><text x="18" y="60" class="label">THE SAVIOUR · prototype</text><text x="18" y="106" font-size="20" font-weight="700">Check before sending</text><text x="18" y="140" font-size="10" font-weight="400">PICKUP</text><text x="18" y="160" font-size="12" font-weight="700">Sample Gate 2</text><path d="M18 170h320" stroke="#aaa"/><text x="18" y="198" font-size="10" font-weight="400">HELP NEEDED</text><text x="18" y="218" font-size="12" font-weight="700">Medical emergency</text><path d="M18 228h320" stroke="#aaa"/><text x="18" y="256" font-size="10" font-weight="400">CONTACT</text><text x="18" y="276" font-size="12" font-weight="700">0000000000</text><path d="M18 286h320" stroke="#aaa"/><text x="18" y="321" font-size="11" font-weight="400">Edit details / Simulate a failed send</text><rect class="cta" x="18" y="340" width="354" height="40" rx="3"/><text x="30" y="365" class="ctaText">Show request sent</text><text x="0" y="427" class="label">Patient-state study explores delivery separately.</text></g><g transform="translate(465 593)"><text y="18" class="heading">05 / Sent and waiting</text><rect y="34" width="390" height="366" rx="8" fill="white" stroke="#777"/><path d="M0 75h390" stroke="#ccc"/><text x="18" y="60" class="label">THE SAVIOUR · prototype</text><text x="18" y="106" font-size="20" font-weight="700">Request sent</text><text x="43" y="145" font-size="12" font-weight="700">Delivered · simulated</text><text x="43" y="163" font-size="10" font-weight="400">No actual service receives this example.</text><text x="43" y="192" font-size="12" font-weight="700">Provider response pending</text><text x="43" y="210" font-size="10" font-weight="400">No ambulance or arrival time confirmed.</text><rect x="18" y="253" width="170" height="27" rx="3" fill="white" stroke="#aaa"/><text x="27" y="271" font-size="10" font-weight="400">Simulate acceptance</text><rect x="198" y="253" width="174" height="27" rx="3" fill="white" stroke="#aaa"/><text x="207" y="271" font-size="10" font-weight="400">Simulate no response</text><text x="18" y="316" font-size="11" font-weight="400">Direct-call alternative stays visible.</text><rect class="cta" x="18" y="340" width="354" height="40" rx="3"/><text x="30" y="365" class="ctaText">Call 112 alternative</text><text x="0" y="427" class="label">Sent and accepted remain distinct interface states.</text></g><g transform="translate(890 593)"><text y="18" class="heading">06 / Failure and no response</text><rect y="34" width="390" height="366" rx="8" fill="white" stroke="#777"/><path d="M0 75h390" stroke="#ccc"/><text x="18" y="60" class="label">THE SAVIOUR · prototype</text><text x="18" y="106" font-size="20" font-weight="700">Recovery branches</text><rect x="18" y="126" width="354" height="81" rx="3" fill="white" stroke="#aaa"/><text x="31" y="150" font-size="15" font-weight="700">Request not sent</text><text x="31" y="174" font-size="11" font-weight="400">Retry from review; retain the draft.</text><rect x="18" y="223" width="354" height="81" rx="3" fill="white" stroke="#aaa"/><text x="31" y="247" font-size="15" font-weight="700">No response yet</text><text x="31" y="271" font-size="11" font-weight="400">Sent, but no provider has accepted.</text><text x="18" y="324" font-size="11" font-weight="400">No assigned vehicle or ETA in either branch.</text><rect class="cta" x="18" y="340" width="354" height="40" rx="3"/><text x="30" y="365" class="ctaText">Retry / Direct call</text><text x="0" y="427" class="label">Separate recovery paths; no automatic escalation claimed.</text></g><text x="40" y="1090" font-size="13">Low fidelity structure · Original SVG source · Revised 15 Nov 2026 · Screens show proposed content, not user research results.</text></svg>